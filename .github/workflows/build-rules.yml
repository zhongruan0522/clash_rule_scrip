name: Build Clash rule packs

on:
  schedule:
    # Asia/Shanghai 08:00, 12:00, 16:00, 20:00.
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "custom/upstream.yml"
      - "custom/block.yaml"
      - "custom/clean-node.yaml"
      - "custom/foreign-line.yaml"
      - "custom/china-direct.yaml"
      - "scripts/build_rules.py"
      - ".github/workflows/build-rules.yml"

permissions:
  contents: write

concurrency:
  group: build-clash-rule-packs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML library
        run: python -m pip install PyYAML==6.0.2

      - name: Aggregate upstream rules
        run: python scripts/build_rules.py

      - name: Commit refreshed packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git add dist/block.yaml dist/clean-node.yaml dist/foreign-line.yaml dist/china-direct.yaml
            build_stamp="$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M')"
            git commit -m "fix(rule): 更新规则-${build_stamp}"
            git push
          fi
